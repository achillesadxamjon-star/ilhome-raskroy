<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ilHOME - Wood & Serve Raskroy Buyurtma Tizimi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- SheetJS (XLSX) for Export/Import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F7F3ED;
      color: #1c1917;
      margin: 0;
      padding: 0;
    }
    .font-script {
      font-family: 'Caveat', cursive;
    }
    .font-mono-num {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    @media screen and (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- PRESETS & CONSTANTS ---
    const MATERIAL_PRESETS = [
      "LDSP 18mm Oq",
      "LDSP 18mm Yong'oq",
      "LDSP 18mm Eman",
      "MDF 18mm Oq",
      "LDSP 18mm Kulrang",
    ];

    const COMMON_DIMENSIONS = [2800, 2070, 700, 560, 400, 300];

    const PART_NAME_SUGGESTIONS = [
      "Yon devor",
      "Tepa qopqoq",
      "Polka",
      "G'aladon yoni",
      "G'aladon osti",
      "Fasad / Eshik",
      "Javroncha"
    ];

    // Main App Component
    function App() {
      // Customer & Material state
      const [customer, setCustomer] = useState(() => {
        const saved = localStorage.getItem('ilhome_customer');
        return saved ? JSON.parse(saved) : { name: '', phone: '', material: '' };
      });

      // Order Parts state
      const [parts, setParts] = useState(() => {
        const saved = localStorage.getItem('ilhome_parts');
        return saved ? JSON.parse(saved) : [];
      });

      // New Part Form State
      const [length, setLength] = useState('');
      const [width, setWidth] = useState('');
      const [quantity, setQuantity] = useState('1');
      const [name, setName] = useState('');
      const [texture, setTexture] = useState(true);

      // EdgeBands selection: U1, U2, K1, K2
      const [edgeBands, setEdgeBands] = useState({
        u1: true,
        u2: true,
        k1: true,
        k2: true,
      });

      // Quick edge preset mode
      const [edgePreset, setEdgePreset] = useState('4ga'); // '4ga', '2U', '2K', 'Yo'q', 'custom'

      // Editing state
      const [editingId, setEditingId] = useState(null);
      const [formError, setFormError] = useState('');

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('ilhome_customer', JSON.stringify(customer));
      }, [customer]);

      useEffect(() => {
        localStorage.setItem('ilhome_parts', JSON.stringify(parts));
      }, [parts]);

      // Apply Edge Preset
      const applyEdgePreset = (preset) => {
        setEdgePreset(preset);
        if (preset === '4ga') {
          setEdgeBands({ u1: true, u2: true, k1: true, k2: true });
        } else if (preset === '2U') {
          setEdgeBands({ u1: true, u2: true, k1: false, k2: false });
        } else if (preset === '2K') {
          setEdgeBands({ u1: false, u2: false, k1: true, k2: true });
        } else if (preset === 'Yo\'q') {
          setEdgeBands({ u1: false, u2: false, k1: false, k2: false });
        }
      };

      const toggleEdge = (side) => {
        setEdgeBands(prev => {
          const next = { ...prev, [side]: !prev[side] };
          if (next.u1 && next.u2 && next.k1 && next.k2) setEdgePreset('4ga');
          else if (next.u1 && next.u2 && !next.k1 && !next.k2) setEdgePreset('2U');
          else if (!next.u1 && !next.u2 && next.k1 && next.k2) setEdgePreset('2K');
          else if (!next.u1 && !next.u2 && !next.k1 && !next.k2) setEdgePreset('Yo\'q');
          else setEdgePreset('custom');
          return next;
        });
      };

      const adjustQty = (delta) => {
        const val = parseInt(quantity, 10) || 0;
        const next = Math.max(1, val + delta);
        setQuantity(next.toString());
      };

      const resetForm = () => {
        setLength('');
        setWidth('');
        setQuantity('1');
        setName('');
        setTexture(true);
        setEdgeBands({ u1: true, u2: true, k1: true, k2: true });
        setEdgePreset('4ga');
        setEditingId(null);
        setFormError('');
      };

      const handleAddOrUpdatePart = (e) => {
        e.preventDefault();
        const l = parseFloat(length);
        const w = parseFloat(width);
        const q = parseInt(quantity, 10);

        if (!l || l <= 0) {
          setFormError("Uzunlikni to'g'ri kiriting (mm da).");
          return;
        }
        if (!w || w <= 0) {
          setFormError("Kenglikni to'g'ri kiriting (mm da).");
          return;
        }
        if (!q || q <= 0) {
          setFormError("Miqdorni kamida 1 dona qiling.");
          return;
        }

        setFormError('');

        if (editingId) {
          setParts(parts.map(p => p.id === editingId ? {
            ...p,
            length: l,
            width: w,
            quantity: q,
            name: name.trim() || 'Detal',
            texture,
            edgeBands: { ...edgeBands }
          } : p));
        } else {
          const newPart = {
            id: Date.now().toString(),
            length: l,
            width: w,
            quantity: q,
            name: name.trim() || 'Detal',
            texture,
            edgeBands: { ...edgeBands }
          };
          setParts([...parts, newPart]);
        }

        resetForm();
      };

      const handleEdit = (part) => {
        setEditingId(part.id);
        setLength(part.length.toString());
        setWidth(part.width.toString());
        setQuantity(part.quantity.toString());
        setName(part.name);
        setTexture(part.texture);
        setEdgeBands({ ...part.edgeBands });
        
        const { u1, u2, k1, k2 } = part.edgeBands;
        if (u1 && u2 && k1 && k2) setEdgePreset('4ga');
        else if (u1 && u2 && !k1 && !k2) setEdgePreset('2U');
        else if (!u1 && !u2 && k1 && k2) setEdgePreset('2K');
        else if (!u1 && !u2 && !k1 && !k2) setEdgePreset('Yo\'q');
        else setEdgePreset('custom');

        window.scrollTo({ top: 150, behavior: 'smooth' });
      };

      const handleDelete = (id) => {
        if (confirm("Ushbu detalni o'chirmoqchimisiz?")) {
          setParts(parts.filter(p => p.id !== id));
          if (editingId === id) resetForm();
        }
      };

      const handleClearOrder = () => {
        if (confirm("Barcha detallar va ma'lumotlar tozalanadi. Ishonchingiz komilmi?")) {
          setParts([]);
          setCustomer({ name: '', phone: '', material: '' });
          resetForm();
        }
      };

      // Summary Calculations
      const totalPartCount = parts.reduce((sum, p) => sum + p.quantity, 0);
      const totalAreaM2 = parts.reduce((sum, p) => sum + (p.length * p.width * p.quantity) / 1000000, 0);
      const totalEdgeMeters = parts.reduce((sum, p) => {
        let edgeLengthMm = 0;
        if (p.edgeBands.u1) edgeLengthMm += p.length;
        if (p.edgeBands.u2) edgeLengthMm += p.length;
        if (p.edgeBands.k1) edgeLengthMm += p.width;
        if (p.edgeBands.k2) edgeLengthMm += p.width;
        return sum + (edgeLengthMm * p.quantity) / 1000;
      }, 0);

      // Export to Excel
      const exportToExcel = () => {
        if (parts.length === 0) {
          alert("Eksport qilish uchun kamida 1 ta detal qo'shing.");
          return;
        }

        const data = parts.map((p, idx) => {
          const edges = [];
          if (p.edgeBands.u1) edges.push('U1');
          if (p.edgeBands.u2) edges.push('U2');
          if (p.edgeBands.k1) edges.push('K1');
          if (p.edgeBands.k2) edges.push('K2');

          return {
            "№": idx + 1,
            "Detal Nomi": p.name,
            "Uzunlik (mm)": p.length,
            "Kenglik (mm)": p.width,
            "Soni (dona)": p.quantity,
            "Kromka (Chekka)": edges.join(', ') || 'Yo\'q',
            "Tekstura": p.texture ? 'Ha' : 'Yo\'q',
            "Maydon (m²)": ((p.length * p.width * p.quantity) / 1000000).toFixed(3)
          };
        });

        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Raskroy Buyurtma");

        const fileName = `${customer.name ? customer.name.replace(/\s+/g, '_') : 'Buyurtma'}_ilHOME_raskroy.xlsx`;
        XLSX.writeFile(wb, fileName);
      };

      // Send to Telegram
      const sendToTelegram = () => {
        if (parts.length === 0) {
          alert("Yuborish uchun kamida 1 ta detal kiriting.");
          return;
        }

        let text = `📦 *ilHOME WOOD & SERVE - BUYURTMA*\n\n`;
        text += `👤 *Mijoz:* ${customer.name || 'Kiritilmagan'}\n`;
        text += `📞 *Tel:* ${customer.phone || 'Kiritilmagan'}\n`;
        text += `🪵 *Material:* ${customer.material || 'Kiritilmagan'}\n\n`;
        text += `📐 *DETALLAR RO'YXATI (${parts.length} tur, ${totalPartCount} dona):*\n`;

        parts.forEach((p, i) => {
          const e = [];
          if (p.edgeBands.u1) e.push('U1');
          if (p.edgeBands.u2) e.push('U2');
          if (p.edgeBands.k1) e.push('K1');
          if (p.edgeBands.k2) e.push('K2');
          const edgeStr = e.length > 0 ? e.join('+') : 'Yo\'q';

          text += `${i+1}. *${p.name}*: ${p.length}x${p.width} mm - ${p.quantity} dona [Kromka: ${edgeStr}] ${p.texture ? '🧭' : ''}\n`;
        });

        text += `\n📊 *UMUMIY HISOB:*\n`;
        text += `• Umumiy Maydon: *${totalAreaM2.toFixed(2)} m²*\n`;
        text += `• Umumiy Kromka: *${totalEdgeMeters.toFixed(1)} metr*\n`;

        const encoded = encodeURIComponent(text);
        window.open(`https://t.me/share/url?url=${encoded}`, '_blank');
      };

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          {/* Clean Header */}
          <header className="bg-slate-900 border-b border-amber-950/40 text-white sticky top-0 z-30 shadow-md w-full">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between w-full overflow-hidden">
              <div className="flex items-center gap-2 sm:gap-3">
                <div className="flex flex-col select-none">
                  <div className="flex items-baseline gap-0.5">
                    <span className="relative font-script text-2xl sm:text-4xl font-bold text-red-600 tracking-wide flex items-center">
                      il
                    </span>
                    <span className="font-display text-xl sm:text-3xl font-extrabold text-white tracking-wider ml-0.5">
                      HOME
                    </span>
                  </div>
                  <span className="text-[9px] sm:text-[10px] font-semibold text-amber-200/80 tracking-[0.2em] -mt-1 uppercase">
                    WOOD & SERVE
                  </span>
                </div>
                <span className="hidden md:inline-block px-2.5 py-0.5 text-[11px] font-semibold bg-amber-950/60 text-amber-200 rounded-full border border-amber-800/40">
                  Raskroy buyurtma tizimi
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={handleClearOrder}
                  type="button"
                  className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1 sm:py-1.5 text-xs font-semibold text-rose-300 hover:text-rose-200 bg-rose-950/60 hover:bg-rose-900/80 border border-rose-800/60 rounded-xl transition-all cursor-pointer"
                >
                  🔄 <span>Tozalash</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-2.5 sm:px-6 lg:px-8 py-3 sm:py-6 pb-36 sm:pb-16 overflow-x-hidden">
            
            {/* Customer & Material Form */}
            <div className="bg-stone-50/90 rounded-2xl shadow-sm border border-stone-200/90 p-3 sm:p-6 mb-4 sm:mb-6">
              <div className="flex flex-col xs:flex-row xs:items-center justify-between gap-1 mb-3 pb-2 border-b border-stone-200/80">
                <h2 className="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-stone-800 flex items-center gap-1.5">
                  👤 Mijoz Ma'lumotlari
                </h2>
                <span className="text-[11px] text-stone-500 font-medium">1-bosqich: Mijoz va Material</span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Mijoz Ismi <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={customer.name}
                    onChange={(e) => setCustomer({...customer, name: e.target.value})}
                    placeholder="Masalan: Alisher Navoiy"
                    className="w-full px-3 h-11 sm:h-12 text-sm sm:text-base font-medium bg-white border border-stone-300 rounded-xl focus:ring-2 focus:ring-red-500 text-stone-900"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">Telefon Nomeri <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={customer.phone}
                    onChange={(e) => setCustomer({...customer, phone: e.target.value})}
                    placeholder="+998 90 123 45 67"
                    className="w-full px-3 h-11 sm:h-12 text-sm sm:text-base font-bold font-mono-num bg-white border border-stone-300 rounded-xl focus:ring-2 focus:ring-red-500 text-stone-900"
                  />
                </div>
                <div className="sm:col-span-2 md:col-span-1">
                  <label className="block text-xs font-bold text-stone-700 mb-1">Material Nomi <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={customer.material}
                    onChange={(e) => setCustomer({...customer, material: e.target.value})}
                    placeholder="Masalan: LDSP 18mm Yong'oq"
                    className="w-full px-3 h-11 sm:h-12 text-sm sm:text-base font-medium bg-white border border-stone-300 rounded-xl focus:ring-2 focus:ring-red-500 text-stone-900"
                  />
                </div>
              </div>

              <div className="mt-3 flex items-center gap-1.5 pt-2 border-t border-stone-200/50 overflow-x-auto no-scrollbar max-w-full pb-0.5">
                <span className="text-[11px] text-stone-500 font-semibold shrink-0">🏷️ Tezkor material:</span>
                {MATERIAL_PRESETS.map((p) => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => setCustomer({...customer, material: p})}
                    className={`px-2.5 py-1 text-xs rounded-xl border transition-all cursor-pointer shrink-0 whitespace-nowrap ${
                      customer.material === p
                        ? 'bg-red-50 text-red-700 border-red-300 font-bold'
                        : 'bg-white hover:bg-stone-100 text-stone-700 border-stone-200'
                    }`}
                  >
                    {p}
                  </button>
                ))}
              </div>
            </div>

            {/* Part Input & Edgeband Selector Form */}
            <PartInputPanel
              length={length}
              setLength={setLength}
              width={width}
              setWidth={setWidth}
              quantity={quantity}
              setQuantity={setQuantity}
              name={name}
              setName={setName}
              texture={texture}
              setTexture={setTexture}
              edgeBands={edgeBands}
              toggleEdge={toggleEdge}
              edgePreset={edgePreset}
              applyEdgePreset={applyEdgePreset}
              adjustQty={adjustQty}
              onSubmit={handleAddOrUpdatePart}
              editingId={editingId}
              onCancelEdit={resetForm}
              formError={formError}
            />

            {/* Parts Table */}
            <PartsTable
              parts={parts}
              onEdit={handleEdit}
              onDelete={handleDelete}
              editingId={editingId}
            />

          </main>

          {/* Sticky Bottom Order Summary Bar */}
          <OrderSummaryBar
            partCount={totalPartCount}
            totalArea={totalAreaM2}
            totalEdge={totalEdgeMeters}
            onExportExcel={exportToExcel}
            onSendTelegram={sendToTelegram}
            hasParts={parts.length > 0}
          />
        </div>
      );
    }

    // --- Sub-Component: PartInputPanel ---
    function PartInputPanel({
      length, setLength,
      width, setWidth,
      quantity, setQuantity,
      name, setName,
      texture, setTexture,
      edgeBands, toggleEdge,
      edgePreset, applyEdgePreset,
      adjustQty, onSubmit,
      editingId, onCancelEdit, formError
    }) {
      return (
        <div className="bg-stone-50/90 rounded-2xl shadow-sm border border-stone-200/90 p-3 sm:p-6 mb-4 sm:mb-6">
          <div className="flex flex-col xs:flex-row xs:items-center justify-between gap-1 mb-3 pb-2 border-b border-stone-200/80">
            <h2 className="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-stone-800">
              {editingId ? '✏️ Detalni Tahrirlash' : '➕ Yangi Detal Qo\'shish'}
            </h2>
            <span className="text-[11px] text-stone-500 font-medium">2-bosqich: O'lchamlar va Kromka</span>
          </div>

          {formError && (
            <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-bold flex items-center gap-2">
              <span>⚠️</span>
              <span>{formError}</span>
            </div>
          )}

          <form onSubmit={onSubmit}>
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
              
              {/* Left Column: Dimensions & Details */}
              <div className="lg:col-span-7 space-y-3 sm:space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 sm:gap-3">
                  
                  {/* Length */}
                  <div className="col-span-1">
                    <label className="text-xs font-extrabold text-stone-800 block mb-1">Uzunlik (mm) *</label>
                    <div className="relative">
                      <input
                        type="number"
                        inputMode="numeric"
                        value={length}
                        onChange={(e) => setLength(e.target.value)}
                        placeholder="700"
                        className="w-full h-11 sm:h-14 pl-3 pr-8 text-base sm:text-xl font-black font-mono-num bg-white border-2 border-stone-300 rounded-xl sm:rounded-2xl text-stone-900"
                      />
                      <span className="absolute right-2 top-2.5 sm:top-4 text-xs font-bold text-stone-400 pointer-events-none">mm</span>
                    </div>
                    <div className="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar max-w-full pb-0.5">
                      {COMMON_DIMENSIONS.slice(0, 4).map((dim) => (
                        <button key={dim} type="button" onClick={() => setLength(dim.toString())} className="px-2 py-0.5 text-[10px] font-bold bg-white border border-stone-200 rounded-lg shrink-0">{dim}</button>
                      ))}
                    </div>
                  </div>

                  {/* Width */}
                  <div className="col-span-1">
                    <label className="text-xs font-extrabold text-stone-800 block mb-1">Kenglik (mm) *</label>
                    <div className="relative">
                      <input
                        type="number"
                        inputMode="numeric"
                        value={width}
                        onChange={(e) => setWidth(e.target.value)}
                        placeholder="400"
                        className="w-full h-11 sm:h-14 pl-3 pr-8 text-base sm:text-xl font-black font-mono-num bg-white border-2 border-stone-300 rounded-xl sm:rounded-2xl text-stone-900"
                      />
                      <span className="absolute right-2 top-2.5 sm:top-4 text-xs font-bold text-stone-400 pointer-events-none">mm</span>
                    </div>
                    <div className="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar max-w-full pb-0.5">
                      {COMMON_DIMENSIONS.slice(2, 6).map((dim) => (
                        <button key={dim} type="button" onClick={() => setWidth(dim.toString())} className="px-2 py-0.5 text-[10px] font-bold bg-white border border-stone-200 rounded-lg shrink-0">{dim}</button>
                      ))}
                    </div>
                  </div>

                  {/* Quantity */}
                  <div className="col-span-2 sm:col-span-1">
                    <label className="text-xs font-extrabold text-stone-800 block mb-1">Miqdor (dona) *</label>
                    <div className="flex items-center gap-1">
                      <button type="button" onClick={() => adjustQty(-1)} className="w-10 h-11 sm:h-14 bg-stone-200 rounded-xl sm:rounded-2xl font-bold text-lg shrink-0">-</button>
                      <input
                        type="number"
                        inputMode="numeric"
                        value={quantity}
                        onChange={(e) => setQuantity(e.target.value)}
                        className="w-full h-11 sm:h-14 text-center text-base sm:text-xl font-black font-mono-num bg-white border-2 border-stone-300 rounded-xl sm:rounded-2xl text-stone-900"
                      />
                      <button type="button" onClick={() => adjustQty(1)} className="w-10 h-11 sm:h-14 bg-red-100 text-red-700 rounded-xl sm:rounded-2xl font-bold text-lg shrink-0">+</button>
                    </div>
                    <div className="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar max-w-full pb-0.5">
                      {[1, 2, 4, 6, 8, 10].map((q) => (
                        <button
                          key={`q-${q}`}
                          type="button"
                          onClick={() => setQuantity(q.toString())}
                          className={`px-2 py-0.5 text-[10px] font-bold rounded-lg border cursor-pointer shrink-0 ${
                            quantity === q.toString()
                              ? 'bg-red-600 text-white border-red-700'
                              : 'bg-white hover:bg-stone-100 text-stone-700 border-stone-200'
                          }`}
                        >
                          {q}d
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                  <div>
                    <label className="block text-xs font-extrabold text-stone-800 mb-1">Tekstura (Yog'och Yo'nalishi)</label>
                    <div className="bg-amber-50/90 border border-amber-300/90 rounded-2xl p-2 sm:p-2.5 flex justify-between items-center shadow-2xs">
                      <div className="flex items-center gap-1.5">
                        <span className="w-6 h-6 rounded-full bg-amber-100 flex items-center justify-center text-amber-800 font-bold text-xs">🧭</span>
                        <span className="text-xs font-extrabold text-stone-800">Tekstura</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => setTexture(!texture)}
                        className={`px-3 py-1 rounded-xl text-xs font-black transition-all cursor-pointer ${
                          texture ? 'bg-amber-600 text-white hover:bg-amber-700' : 'bg-stone-200 text-stone-700'
                        }`}
                      >
                        {texture ? 'Ha (Muhim)' : 'Yo\'q'}
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold text-stone-800 mb-1">Detal Nomi</label>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Masalan: Yon devor"
                      className="w-full h-11 px-3 text-sm font-medium bg-white border border-stone-300 rounded-2xl text-stone-900"
                    />
                  </div>
                </div>

                <div className="flex items-center gap-1.5 pt-1 overflow-x-auto no-scrollbar max-w-full pb-0.5">
                  <span className="text-[11px] text-stone-500 font-bold shrink-0">Tavsiyalar:</span>
                  {PART_NAME_SUGGESTIONS.map((s) => (
                    <button key={s} type="button" onClick={() => setName(s)} className="px-2 py-0.5 text-xs bg-white text-stone-700 border border-stone-200 rounded-xl shrink-0 whitespace-nowrap">{s}</button>
                  ))}
                </div>
              </div>

              {/* Right Column: EdgeBand Selector & Submit */}
              <div className="lg:col-span-5 flex flex-col justify-between space-y-4">
                <EdgeBandSelector
                  edgeBands={edgeBands}
                  toggleEdge={toggleEdge}
                  edgePreset={edgePreset}
                  applyEdgePreset={applyEdgePreset}
                  lengthVal={length || 'U'}
                  widthVal={width || 'K'}
                />

                <div className="flex gap-2">
                  {editingId && (
                    <button
                      type="button"
                      onClick={onCancelEdit}
                      className="px-4 h-14 bg-stone-200 hover:bg-stone-300 text-stone-800 font-bold rounded-2xl transition-all cursor-pointer"
                    >
                      Bekor qilish
                    </button>
                  )}
                  <button
                    type="submit"
                    className="flex-1 h-14 bg-red-600 hover:bg-red-700 text-white font-extrabold text-base tracking-wide rounded-2xl shadow-md transition-all cursor-pointer active:scale-[0.99]"
                  >
                    {editingId ? 'DETALNI SAQLASH' : 'DETALNI JADVALGA QO\'SHISH'}
                  </button>
                </div>
              </div>

            </div>
          </form>
        </div>
      );
    }

    // --- Sub-Component: EdgeBandSelector ---
    function EdgeBandSelector({ edgeBands, toggleEdge, edgePreset, applyEdgePreset, lengthVal, widthVal }) {
      return (
        <div className="bg-stone-100/80 rounded-2xl p-4 border border-stone-200/80 flex flex-col justify-between">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold text-stone-800">Kromka (Chekka)</span>
            <div className="flex items-center gap-1 bg-stone-200/70 p-1 rounded-xl">
              {['4 ga', '2 U', '2 K', 'Yo\'q'].map((pKey) => {
                const isSelected = edgePreset === pKey || (pKey === '4 ga' && edgePreset === '4ga');
                return (
                  <button
                    key={pKey}
                    type="button"
                    onClick={() => applyEdgePreset(pKey === '4 ga' ? '4ga' : pKey)}
                    className={`px-2 py-0.5 text-[11px] font-bold rounded-lg transition-all ${
                      isSelected ? 'bg-amber-600 text-white shadow-2xs' : 'text-stone-700 hover:text-stone-900'
                    }`}
                  >
                    {pKey}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Visual Interactive Board Representation */}
          <div className="relative w-full aspect-[16/10] max-h-[170px] bg-stone-200/60 rounded-xl border border-stone-300/60 p-4 flex items-center justify-center my-1">
            <div className="relative w-full h-full max-w-[220px] max-h-[120px] bg-amber-50 rounded border-2 border-stone-400 flex items-center justify-center shadow-2xs">
              
              {/* U1 Edge (Top) */}
              <button
                type="button"
                onClick={() => toggleEdge('u1')}
                className={`absolute -top-3.5 left-2 right-2 h-3.5 rounded-t-sm text-[10px] font-black tracking-wider flex items-center justify-center transition-all cursor-pointer ${
                  edgeBands.u1 ? 'bg-red-600 text-white' : 'bg-stone-300 text-stone-500 hover:bg-stone-400'
                }`}
              >
                U1
              </button>

              {/* U2 Edge (Bottom) */}
              <button
                type="button"
                onClick={() => toggleEdge('u2')}
                className={`absolute -bottom-3.5 left-2 right-2 h-3.5 rounded-b-sm text-[10px] font-black tracking-wider flex items-center justify-center transition-all cursor-pointer ${
                  edgeBands.u2 ? 'bg-red-600 text-white' : 'bg-stone-300 text-stone-500 hover:bg-stone-400'
                }`}
              >
                U2
              </button>

              {/* K1 Edge (Left) */}
              <button
                type="button"
                onClick={() => toggleEdge('k1')}
                className={`absolute -left-3.5 top-2 bottom-2 w-3.5 rounded-l-sm text-[10px] font-black tracking-wider flex items-center justify-center transition-all cursor-pointer ${
                  edgeBands.k1 ? 'bg-red-600 text-white' : 'bg-stone-300 text-stone-500 hover:bg-stone-400'
                }`}
              >
                K1
              </button>

              {/* K2 Edge (Right) */}
              <button
                type="button"
                onClick={() => toggleEdge('k2')}
                className={`absolute -right-3.5 top-2 bottom-2 w-3.5 rounded-r-sm text-[10px] font-black tracking-wider flex items-center justify-center transition-all cursor-pointer ${
                  edgeBands.k2 ? 'bg-red-600 text-white' : 'bg-stone-300 text-stone-500 hover:bg-stone-400'
                }`}
              >
                K2
              </button>

              <div className="text-center">
                <span className="text-xs font-black font-mono-num text-stone-800">
                  {lengthVal} × {widthVal} mm
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Sub-Component: PartsTable ---
    function PartsTable({ parts, onEdit, onDelete, editingId }) {
      if (parts.length === 0) {
        return (
          <div className="bg-white rounded-2xl border-2 border-dashed border-stone-200 p-8 text-center my-6">
            <p className="text-stone-400 text-sm font-medium">Hozircha hech qanday detal qo'shilmadi.</p>
            <p className="text-stone-500 text-xs mt-1">Yuqoridagi shakl orqali birinchi detalni kiriting.</p>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden my-6">
          <div className="px-6 py-4 bg-stone-50 border-b border-stone-200 flex justify-between items-center">
            <h3 className="font-extrabold text-stone-800 text-sm uppercase tracking-wider">
              Detallar Ro'yxati ({parts.length} tur)
            </h3>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs text-stone-700">
              <thead className="bg-stone-100 text-stone-600 uppercase font-extrabold text-[10px] tracking-wider border-b border-stone-200">
                <tr>
                  <th className="px-4 py-3 text-center">№</th>
                  <th className="px-4 py-3">Detal Nomi</th>
                  <th className="px-4 py-3 text-center">Uzunlik</th>
                  <th className="px-4 py-3 text-center">Kenglik</th>
                  <th className="px-4 py-3 text-center">Soni</th>
                  <th className="px-4 py-3 text-center">Kromka</th>
                  <th className="px-4 py-3 text-center">Tekstura</th>
                  <th className="px-4 py-3 text-right">Amallar</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-stone-200 font-medium">
                {parts.map((p, idx) => {
                  const edges = [];
                  if (p.edgeBands.u1) edges.push('U1');
                  if (p.edgeBands.u2) edges.push('U2');
                  if (p.edgeBands.k1) edges.push('K1');
                  if (p.edgeBands.k2) edges.push('K2');

                  return (
                    <tr
                      key={p.id}
                      className={`hover:bg-amber-50/50 transition-all ${
                        editingId === p.id ? 'bg-amber-100/60 font-bold' : ''
                      }`}
                    >
                      <td className="px-4 py-3.5 text-center font-bold text-stone-400">{idx + 1}</td>
                      <td className="px-4 py-3.5 font-bold text-stone-900">{p.name}</td>
                      <td className="px-4 py-3.5 text-center font-bold font-mono-num text-stone-800">{p.length} mm</td>
                      <td className="px-4 py-3.5 text-center font-bold font-mono-num text-stone-800">{p.width} mm</td>
                      <td className="px-4 py-3.5 text-center">
                        <span className="px-2.5 py-1 bg-stone-100 text-stone-800 font-black rounded-lg text-xs border border-stone-200">
                          {p.quantity} dona
                        </span>
                      </td>
                      <td className="px-4 py-3.5 text-center">
                        {edges.length > 0 ? (
                          <div className="flex items-center justify-center gap-1">
                            {edges.map(e => (
                              <span key={e} className="px-1.5 py-0.5 bg-red-100 text-red-700 font-extrabold rounded text-[10px]">
                                {e}
                              </span>
                            ))}
                          </div>
                        ) : (
                          <span className="text-stone-400 text-[11px]">Yo'q</span>
                        )}
                      </td>
                      <td className="px-4 py-3.5 text-center">
                        {p.texture ? (
                          <span className="text-amber-700 font-bold text-[11px] bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                            🧭 Ha
                          </span>
                        ) : (
                          <span className="text-stone-400 text-[11px]">Yo'q</span>
                        )}
                      </td>
                      <td className="px-4 py-3.5 text-right space-x-2">
                        <button
                          onClick={() => onEdit(p)}
                          className="px-2.5 py-1 text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 rounded-lg cursor-pointer"
                        >
                          Tahrirlash
                        </button>
                        <button
                          onClick={() => onDelete(p.id)}
                          className="px-2.5 py-1 text-xs font-bold text-red-700 bg-red-100 hover:bg-red-200 rounded-lg cursor-pointer"
                        >
                          O'chirish
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- Sub-Component: OrderSummaryBar ---
    function OrderSummaryBar({ partCount, totalArea, totalEdge, onExportExcel, onSendTelegram, hasParts }) {
      return (
        <div className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-amber-950/40 text-white p-3 sm:p-4 z-40 shadow-2xl">
          <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            
            {/* Stats */}
            <div className="flex items-center justify-around sm:justify-start gap-4 sm:gap-8 w-full sm:w-auto text-center sm:text-left">
              <div>
                <span className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider">Jami Detallar</span>
                <span className="text-base sm:text-lg font-black font-mono-num text-amber-400">{partCount} dona</span>
              </div>
              <div className="h-8 w-px bg-slate-800"></div>
              <div>
                <span className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider">Maydon (m²)</span>
                <span className="text-base sm:text-lg font-black font-mono-num text-amber-400">{totalArea.toFixed(2)} m²</span>
              </div>
              <div className="h-8 w-px bg-slate-800"></div>
              <div>
                <span className="block text-[10px] font-bold text-stone-400 uppercase tracking-wider">Kromka</span>
                <span className="text-base sm:text-lg font-black font-mono-num text-amber-400">{totalEdge.toFixed(1)} m</span>
              </div>
            </div>

            {/* Actions */}
            <div className="flex items-center gap-2 w-full sm:w-auto">
              <button
                onClick={onExportExcel}
                disabled={!hasParts}
                type="button"
                className="flex-1 sm:flex-initial h-12 px-4 bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl transition-all cursor-pointer flex items-center justify-center gap-2"
              >
                <span>📊 Excel Yuklash</span>
              </button>
              <button
                onClick={onSendTelegram}
                disabled={!hasParts}
                type="button"
                className="flex-1 sm:flex-initial h-12 px-5 bg-red-600 hover:bg-red-500 disabled:opacity-50 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2"
              >
                <span>✈️ Buyurtmani Yuborish</span>
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
